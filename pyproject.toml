[project]
name = "finchat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.1.1",
    "openai>=2.24.0",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.17.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "sentence-transformers>=5.2.3",
    "socksio>=1.0.0",
    "spacy>=3.8.11",
    "tiktoken>=0.12.0",
    "torch>=2.10.0",
    "unstructured[md]>=0.21.5",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
